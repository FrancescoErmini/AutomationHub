name: automation-hub

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-automation_hub}
      POSTGRES_USER: ${POSTGRES_USER:-automation_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-automation_hub_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-automation_hub} -d ${POSTGRES_DB:-automation_hub}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-automation_hub}:${POSTGRES_PASSWORD:-automation_hub_dev}@postgres:5432/${POSTGRES_DB:-automation_hub}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RPA_WORKBOOK_PATH: "/workspace/data/raw/RPA - o365.xlsx"
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./data:/workspace/data
      - ./artifacts:/workspace/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  e2e:
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    profiles: [test]
    working_dir: /work/frontend
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend:5173
    volumes:
      - .:/work
    command: ["npm", "run", "test:e2e"]
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:

