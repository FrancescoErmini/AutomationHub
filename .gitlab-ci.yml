# GitLab CI/CD pipeline for Automation Hub, aligned with standard templates

include:
  - project: 'ci_cd_ict_sdlc/pipelines_sot'
    file: 'GENERIC/cicd-generic-templates.yaml'
  - project: 'ci_cd_ict_sdlc/pipelines_sot'
    file: 'ICT/automation-hub/cicd-automation-hub-template.yaml'

variables:
  # -- Standard GAR & Image Configuration --
  DOCKER_HOST: tcp://localhost:2375
  DOCKER_TLS_CERTDIR: ""
  MENARINI_ARTIFACT_REGISTRY_SERVER: "europe-docker.pkg.dev"
  MENARINI_ARTIFACT_REGISTRY_URL: "${MENARINI_ARTIFACT_REGISTRY_SERVER}/mgcp-sdlc-230917012"
  MENARINI_ARTIFACT_REGISTRY_USER: "_json_key"

  # -- Project-Specific Variables --
  APP_PROJECT: "ict"
  APP_NAME: "automation-hub"
  TEAM: "ict"
  MANIFEST_REPO: "global-manifest/automation-hub-manifest"
  MANIFEST_PATH: "overlays"
  
  # -- Image URIs --
  BACKEND_IMAGE_URI: "${MENARINI_ARTIFACT_REGISTRY_URL}/${APP_PROJECT}/${APP_NAME}/backend"
  FRONTEND_IMAGE_URI: "${MENARINI_ARTIFACT_REGISTRY_URL}/${APP_PROJECT}/${APP_NAME}/frontend"

  # -- Azure Storage for reports --
  AZURE_STORAGE_ACCOUNT: "sdlcsecurityreport"
  AZURE_STORAGE_CONTAINER: "sdlcblobstorage"

stages:
  - checkstyle-and-test
  - quality
  - release
  - integration

# --- Checkstyle Stage ---
python_checkstyle:
  extends: .automation_hub_python_checkstyle_template
  allow_failure: true

# --- Quality Stage ---
sonar_scan:
  extends: .sonar_scan_python_template
  stage: quality
  needs: ["python_checkstyle"]
  variables:
    GLOBAL_SONAR_TOKEN: "$SONAR_TOKEN"

trivy_scan:
  extends: .trivy_scan_template
  stage: quality
  needs: ["python_checkstyle"]

# --- Release Stage ---
# Refactored to use the standard template without overriding the script.
# The template handles tagging and pushing automatically.
build_backend:
  extends: .build_buildah_branch_image_template
  stage: release
  variables:
    REPOSITORY_URI: "$BACKEND_IMAGE_URI"
    BUILD_CONTEXT: "backend/"
    DOCKERFILE_PATH: "backend/Dockerfile"
  script:
    - |
      if [[ "${CI_COMMIT_REF_NAME}" == "main" ]]; then
        TAG="prod"
      elif [[ "${CI_COMMIT_REF_NAME}" == "develop" ]]; then
        TAG="dev"
      elif [[ "${CI_COMMIT_REF_NAME}" == "quality" ]]; then
        TAG="qa"
      elif [[ "${CI_COMMIT_REF_NAME}" == "release" ]]; then
        TAG="rel"
      else
        TAG="${CI_COMMIT_REF_NAME}"
      fi
      export IMAGE_TAG="${TAG}-${CI_COMMIT_SHA:0:8}"
    - buildah bud --ulimit nofile=4096:8192 -f ${DOCKERFILE_PATH} -t "${REPOSITORY_URI}:${IMAGE_TAG}" ${BUILD_CONTEXT}
    - echo "Pushing image ${REPOSITORY_URI}:${IMAGE_TAG}"
    - buildah push "${REPOSITORY_URI}:${IMAGE_TAG}"

build_frontend:
  extends: .build_buildah_branch_image_template
  stage: release
  variables:
    REPOSITORY_URI: "$FRONTEND_IMAGE_URI"
    BUILD_CONTEXT: "frontend/"
    DOCKERFILE_PATH: "frontend/Dockerfile"
  script:
    - |
      if [[ "${CI_COMMIT_REF_NAME}" == "main" ]]; then
        TAG="prod"
      elif [[ "${CI_COMMIT_REF_NAME}" == "develop" ]]; then
        TAG="dev"
      elif [[ "${CI_COMMIT_REF_NAME}" == "quality" ]]; then
        TAG="qa"
      elif [[ "${CI_COMMIT_REF_NAME}" == "release" ]]; then
        TAG="rel"
      else
        TAG="${CI_COMMIT_REF_NAME}"
      fi
      export IMAGE_TAG="${TAG}-${CI_COMMIT_SHA:0:8}"
    - |
      buildah bud 
        --build-arg VITE_OIDC_AUTHORITY="${VITE_OIDC_AUTHORITY}" 
        --build-arg VITE_OIDC_CLIENT_ID="${VITE_OIDC_CLIENT_ID}" 
        --build-arg VITE_OIDC_REDIRECT_URI="${VITE_OIDC_REDIRECT_URI}" 
        -f ${DOCKERFILE_PATH} -t "${REPOSITORY_URI}:${IMAGE_TAG}" ${BUILD_CONTEXT}
    - echo "Pushing image ${REPOSITORY_URI}:${IMAGE_TAG}"
    - buildah push "${REPOSITORY_URI}:${IMAGE_TAG}"

# --- Integration Stage ---
# Updates manifests for both backend and frontend images.
update_manifest:
  extends: .generic_manifest_integration_template
  stage: integration
  needs: ["build_backend", "build_frontend"]
  script:
    # Inherit before_script from the template which sets up git, kustomize, and IMAGE_TAG
    - git clone "https://${GITLAB_ACCESS_TOKEN_NAME}:${GITLAB_ACCESS_TOKEN}@${CI_SERVER_HOST}/${MANIFEST_REPO}.git" manifest-repo
    - cd manifest-repo/${MANIFEST_PATH}/${ENVIRONMENT}
    - GIT_MESSAGE="$(git log -1 --pretty=%B)"
    - GIT_AUTHOR="$(git log -1 --pretty=%an)"
    - GIT_AUTHOR_EMAIL="$(git log -1 --pretty=%ae)"
    - git config --global user.email "$GIT_AUTHOR_EMAIL"
    - git config --global user.name "$GIT_AUTHOR"
    
    # Update both backend and frontend images
    - kustomize edit set image "${BACKEND_IMAGE_URI}=${BACKEND_IMAGE_URI}:${IMAGE_TAG}"
    - kustomize edit set image "${FRONTEND_IMAGE_URI}=${FRONTEND_IMAGE_URI}:${IMAGE_TAG}"
    
    - git commit -am "Update images for [${APP_NAME}] to tag ${IMAGE_TAG}"
    - git push "https://${GITLAB_ACCESS_TOKEN_NAME}:${GITLAB_ACCESS_TOKEN}@${CI_SERVER_HOST}/${MANIFEST_REPO}.git" HEAD:main

