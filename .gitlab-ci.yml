include:
  - project: 'ci_cd_ict_sdlc/pipelines_sot'
    file: 'GENERIC/cicd-generic-templates.yaml'
  - project: 'ci_cd_ict_sdlc/pipelines_sot'
    file: 'ICT/automation-hub/cicd-automation-hub-template.yaml'

variables:
  DOCKER_HOST: tcp://localhost:2375
  DOCKER_TLS_CERTDIR: ""
  MENARINI_ARTIFACT_REGISTRY_SERVER: europe-docker.pkg.dev
  MENARINI_ARTIFACT_REGISTRY_URL: ${MENARINI_ARTIFACT_REGISTRY_SERVER}/mgcp-sdlc-230917012
  MENARINI_ARTIFACT_REGISTRY_USER: _json_key
  APP_PROJECT: ict
  APP_NAME: automation-hub
  REPOSITORY_URI: "${MENARINI_ARTIFACT_REGISTRY_URL}/${APP_PROJECT}/${APP_NAME}"
  BACKEND_IMAGE: "${REPOSITORY_URI}/backend"
  FRONTEND_IMAGE: "${REPOSITORY_URI}/frontend"

stages:
  - release
  - integration

build_backend:
  extends: .build_buildah_image_template
  stage: release
  script:
    - buildah info
    - export IMAGE_TAG="dev-${CI_COMMIT_SHA:0:8}"
    - echo "Building ${BACKEND_IMAGE}:${IMAGE_TAG}"
    - buildah bud -f backend/Dockerfile -t "${BACKEND_IMAGE}:${IMAGE_TAG}" backend/
    - buildah push "${BACKEND_IMAGE}:${IMAGE_TAG}"

build_frontend:
  extends: .build_buildah_image_template
  stage: release
  script:
    - buildah info
    - export IMAGE_TAG="dev-${CI_COMMIT_SHA:0:8}"
    - echo "Building ${FRONTEND_IMAGE}:${IMAGE_TAG}"
    - buildah bud -f frontend/Dockerfile --build-arg VITE_OIDC_AUTHORITY="${VITE_OIDC_AUTHORITY}" --build-arg VITE_OIDC_CLIENT_ID="${VITE_OIDC_CLIENT_ID}" --build-arg VITE_OIDC_REDIRECT_URI="${VITE_OIDC_REDIRECT_URI}" -t "${FRONTEND_IMAGE}:${IMAGE_TAG}" frontend/
    - buildah push "${FRONTEND_IMAGE}:${IMAGE_TAG}"

