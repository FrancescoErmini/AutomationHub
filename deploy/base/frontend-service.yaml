apiVersion: v1
kind: Service
metadata:
  name: frontend
  annotations:
    cloud.google.com/backend-config: '{"default":"frontend-backendconfig"}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: automation-hub
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
