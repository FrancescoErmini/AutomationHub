apiVersion: v1
kind: Service
metadata:
  name: backend
  annotations:
    cloud.google.com/backend-config: '{"default":"backend-backendconfig"}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: automation-hub
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
