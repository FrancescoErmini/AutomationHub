[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-hub-backend"
version = "0.1.0"
description = "Automation Hub API and ingestion services"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.14.0",
  "fastapi==0.115.6",
  "itsdangerous==2.2.0",
  "openpyxl==3.1.5",
  "psycopg[binary]==3.2.3",
  "pyjwt[crypto]==2.10.1",
  "pydantic-settings==2.7.0",
  "sqladmin==0.24.0",
  "sqlalchemy==2.0.36",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.14.0",
  "pre-commit==4.0.1",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "pytest-cov==6.0.0",
  "ruff==0.8.6",
  "types-openpyxl==3.1.5.20241225",
  "types-setuptools==75.6.0.20241223",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy declarative __table_args__ is a class-level protocol attribute,
# not shared mutable instance state; RUF012 flags it as a false positive.
"app/models/*.py" = ["RUF012"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection style requires Query()/Depends() as literal
# argument defaults; B008 otherwise flags the standard FastAPI pattern.
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires the isolated PostgreSQL test database"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]
